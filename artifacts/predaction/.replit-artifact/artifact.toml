kind = "web"
previewPath = "/"
title = "Prediction Pro"
description = "Discover open Kalshi prediction markets across categories, with prices, resolution rules, sports filters and local watchlists."
version = "1.0.0"
id = "artifacts/predaction"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24726

[services.development]
run = "pnpm --filter @workspace/predaction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/predaction", "run", "build" ]
serve = "static"
publicDir = "artifacts/predaction/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24726"
BASE_PATH = "/"
