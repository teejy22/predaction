openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /flowframe/tools:
    get:
      operationId: getFlowframeTools
      summary: Cached Smart Money Skew and Football Sharps tools
      responses:
        "200":
          description: Independently available tool feeds, cached for one hour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowframeTools" }
  /flowframe/insights:
    get:
      operationId: getFlowframeInsights
      summary: Cached Flowframe Kalshi and Polymarket intelligence and tracked-wallet trades
      responses:
        "200":
          description: Independently available Flowframe feeds with source timestamps and status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowframeInsights" }
  /events:
    get:
      operationId: listEvents
      summary: Browse indexed open Kalshi events across categories
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: sport, in: query, schema: { type: string } }
        - { name: league, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [volume, closing, newest] } }
      responses:
        "200":
          description: Sports market feed
          content:
            application/json:
               schema: { $ref: "#/components/schemas/EventFeed" }
  /events/{ticker}:
    get:
      operationId: getEvent
      summary: Event details and resolution rules
      parameters:
        - { name: ticker, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Event
          content:
            application/json:
               schema: { $ref: "#/components/schemas/PredictionEvent" }
  /sports/games:
    get:
      operationId: listSportsGames
      summary: Browse sports events grouped by matchup
      parameters:
        - { name: sport, in: query, schema: { type: string } }
        - { name: league, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [volume, closing, newest, upcoming] } }
        - { name: live, in: query, description: Only games reported as in progress by Polymarket US., schema: { type: boolean } }
        - { name: notStarted, in: query, description: Only games known not to have started (a future start time or a later game day)., schema: { type: boolean } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Grouped sports game feed
          content:
            application/json:
               schema: { $ref: "#/components/schemas/SportsGameFeed" }
  /sports/games/{key}:
    get:
      operationId: getSportsGame
      summary: All indexed events for one grouped sports matchup
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Grouped sports game
          content:
            application/json:
               schema: { $ref: "#/components/schemas/SportsGame" }
  /overview:
    get:
      operationId: getOverview
      summary: Indexed category counts and feed statistics
      responses:
        "200":
          description: Overview
          content:
            application/json:
               schema: { $ref: "#/components/schemas/MarketOverview" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    FlowframeItem:
      type: object
      required: [id, title, url, category]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string }
        category: { type: string }
        eventTicker: { type: string }
        probability: { type: number }
        change: { type: number }
        publishedAt: { type: string }
        wallet: { type: string }
        profileUrl: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        outcome: { type: string }
        shares: { type: number }
        usdcSize: { type: number }
        fairValue: { type: number, description: "FlowFrame estimated fair YES probability, 0–100; not a Prediction Pro forecast." }
        edge: { type: number, description: "Fair YES value minus market YES price, signed percentage points; not historical price movement." }
        skewScore: { type: number }
        tiers: { $ref: "#/components/schemas/FlowframeTiers" }
        rank: { type: integer }
        score: { type: number }
        realizedPnl: { type: number }
        roi: { type: number, description: "ROI expressed as a percentage." }
        winRate: { type: number, description: "Win rate expressed as a percentage." }
        realizedCount: { type: integer }
        nflCount: { type: integer }
        cfbCount: { type: integer }
        medianStake: { type: number }
        league: { type: string, enum: [nfl, cfb] }
        unusual: { type: boolean }
        usualMultiple: { type: number }
    FlowframeTier:
      type: object
      required: [yesDollars, noDollars, skew]
      properties:
        yesDollars: { type: number }
        noDollars: { type: number }
        yesCount: { type: integer }
        noCount: { type: integer }
        skew: { type: number }
    FlowframeTiers:
      type: object
      properties:
        sharp: { $ref: "#/components/schemas/FlowframeTier" }
        profitable: { $ref: "#/components/schemas/FlowframeTier" }
        recreational: { $ref: "#/components/schemas/FlowframeTier" }
    FlowframeFeed:
      type: object
      required: [items, status, fetchedAt, checkedAt, message]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FlowframeItem" }
        status: { type: string, enum: [ready, stale, unavailable, unconfigured] }
        fetchedAt: { type: string }
        checkedAt: { type: string }
        message: { type: string }
        backfillDone: { type: boolean }
        sourceUpdatedAt: { type: string }
        clamped: { type: boolean }
        effectiveLimit: { type: integer }
    FlowframeTools:
      type: object
      required: [smartMoney, footballLeaderboard, footballTrades, refreshMinutes, attribution]
      properties:
        smartMoney: { $ref: "#/components/schemas/FlowframeFeed" }
        footballLeaderboard: { $ref: "#/components/schemas/FlowframeFeed" }
        footballTrades: { $ref: "#/components/schemas/FlowframeFeed" }
        refreshMinutes: { type: integer }
        attribution: { type: string }
    FlowframeInsights:
      type: object
      required: [movers, polymarketMovers, trades, trending, pulse, refreshMinutes, attribution]
      properties:
        movers: { $ref: "#/components/schemas/FlowframeFeed" }
        polymarketMovers: { $ref: "#/components/schemas/FlowframeFeed" }
        trades: { $ref: "#/components/schemas/FlowframeFeed" }
        trending: { $ref: "#/components/schemas/FlowframeFeed" }
        pulse: { $ref: "#/components/schemas/FlowframeFeed" }
        refreshMinutes: { type: integer }
        attribution: { type: string }
    PredictionMarket:
      type: object
      required: [ticker, title, subtitle, probability, yesAsk, noAsk, volume, volume24h, change, status, closeTime, rules, url]
      properties:
        ticker: { type: string }
        title: { type: string }
        subtitle: { type: string }
        probability: { type: number }
        yesAsk: { type: number }
        noAsk: { type: number }
        volume: { type: number }
        volume24h: { type: number }
        change: { type: number }
        status: { type: string }
        closeTime: { type: string }
        rules: { type: string }
        url: { type: string }
        image: { type: string, format: uri }
        color: { type: string }
    PredictionEvent:
      type: object
      required: [ticker, seriesTicker, title, subtitle, category, categories, sport, league, volume, volume24h, closeTime, url, markets]
      properties:
        ticker: { type: string }
        seriesTicker: { type: string }
        title: { type: string }
        subtitle: { type: string }
        category: { type: string }
        categories: { type: array, items: { type: string } }
        sport: { type: string }
        league: { type: string }
        teams:
          type: array
          items: { $ref: "#/components/schemas/TeamLogo" }
        image: { type: string, format: uri }
        featuredImage: { type: string, format: uri }
        volume: { type: number }
        volume24h: { type: number }
        closeTime: { type: string }
        url: { type: string }
        markets:
          type: array
          items: { $ref: "#/components/schemas/PredictionMarket" }
    EventFeed:
      type: object
      required: [events, total, updatedAt, source, partial, warnings, indexing, indexedEvents, hasMore, nextOffset]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/PredictionEvent" }
        total: { type: integer }
        updatedAt: { type: string }
        source: { type: string }
        partial: { type: boolean }
        warnings: { type: array, items: { type: string } }
        indexing: { type: boolean }
        indexedEvents: { type: integer }
        hasMore: { type: boolean }
        nextOffset: { type: integer }
    TeamLogo:
      type: object
      required: [name, abbreviation, logo]
      properties:
        name: { type: string }
        abbreviation: { type: string }
        logo: { type: string, format: uri }
    SportsGame:
      type: object
      required: [key, title, subtitle, category, categories, sport, league, volume, volume24h, closeTime, url, eventCount, marketCount, teams, events]
      properties:
        key: { type: string }
        title: { type: string }
        subtitle: { type: string }
        category: { type: string }
        categories: { type: array, items: { type: string } }
        sport: { type: string }
        league: { type: string }
        volume: { type: number }
        volume24h: { type: number }
        closeTime: { type: string }
        url: { type: string }
        gameDate: { type: string, description: "Scheduled game day (YYYY-MM-DD, US Eastern) when Kalshi publishes one" }
        startTime: { type: string, description: "Scheduled start (ISO 8601) from Polymarket US for matched games, otherwise from Kalshi when it publishes one" }
        polymarket: { $ref: "#/components/schemas/PolymarketGameQuote" }
        eventCount: { type: integer }
        marketCount: { type: integer }
        teams:
          type: array
          items: { $ref: "#/components/schemas/TeamLogo" }
        events:
          type: array
          items: { $ref: "#/components/schemas/PredictionEvent" }
    PolymarketGameQuote:
      type: object
      description: "Polymarket US prices for the same game's winner market. Present only when the game was matched on both exchanges."
      required: [url, live, updatedAt, outcomes]
      properties:
        url: { type: string, format: uri }
        startTime: { type: string }
        live: { type: boolean }
        period: { type: string }
        updatedAt: { type: string }
        outcomes:
          type: array
          items:
            type: object
            required: [marketTicker]
            properties:
              marketTicker: { type: string, description: "Kalshi winner market this outcome corresponds to" }
              chance: { type: number, description: "Polymarket US implied chance, 0-100. Absent when there is no reliable two-sided price." }
              score: { type: string, description: "Live score for this side; tennis lists games won per set separated by spaces" }
              ask: { type: number, description: "Best price to buy this outcome on Polymarket US, in cents" }
              color: { type: string }
    SportsGameFeed:
      type: object
      required: [games, total, updatedAt, source, partial, warnings, indexing, indexedEvents, hasMore, nextOffset]
      properties:
        games:
          type: array
          items: { $ref: "#/components/schemas/SportsGame" }
        total: { type: integer }
        updatedAt: { type: string }
        source: { type: string }
        partial: { type: boolean }
        warnings: { type: array, items: { type: string } }
        indexing: { type: boolean }
        indexedEvents: { type: integer }
        hasMore: { type: boolean }
        nextOffset: { type: integer }
    SportCategory:
      type: object
      required: [name, count, leagues]
      properties:
        name: { type: string }
        count: { type: integer }
        leagues: { type: array, items: { type: string } }
        leagueCounts:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }
    MarketOverview:
      type: object
      required: [categories, sports, totalEvents, totalMarkets, totalVolume, volume24h, updatedAt, partial, indexing, warnings]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }
        partial: { type: boolean }
        indexing: { type: boolean }
        warnings: { type: array, items: { type: string } }
        sports:
          type: array
          items: { $ref: "#/components/schemas/SportCategory" }
        totalEvents: { type: integer }
        totalMarkets: { type: integer }
        totalVolume: { type: number }
        volume24h: { type: number }
        updatedAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

